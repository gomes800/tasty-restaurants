services:
  postgres:
    image: postgres:16
    container_name: postgres_tasty
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: tasty-restaurants
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tasty-restaurants" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
